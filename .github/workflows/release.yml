name: Publicar release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar o aplicativo
        run: python -m unittest discover -s tests -v
      - name: Montar pacote do usuário final
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/package_release.py "$RELEASE_VERSION"
      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" --draft \
              --title "BDO Mode Manager $RELEASE_VERSION" \
              --notes-file .github/release-notes.md
            gh release upload "$RELEASE_VERSION" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$RELEASE_VERSION" dist/*.zip dist/*.sha256 \
              --verify-tag --draft \
              --title "BDO Mode Manager $RELEASE_VERSION" \
              --notes-file .github/release-notes.md
          fi
          gh release edit "$RELEASE_VERSION" --draft=false --latest
      - name: Remover releases de tentativa após publicar a versão definitiva
        if: github.ref_name == 'v1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Exclusão solicitada: somente as três releases de tentativa.
          # As tags e os commits antigos são preservados.
          for old_version in v1.0.1 v1.0.2 v1.0.3; do
            if gh release view "$old_version" >/dev/null 2>&1; then
              gh release delete "$old_version" --yes
            fi
          done
