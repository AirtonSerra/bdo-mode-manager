name: Publicar release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar o aplicativo
        run: python -m unittest discover -s tests -v
      - name: Instalar ferramentas de build
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar dependências de build." }
          choco install innosetup --version=6.7.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar Inno Setup." }
      - name: Gerar instalador Windows
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/build_windows.py "$env:RELEASE_VERSION"
      - name: Verificar executável empacotado
        run: python scripts/smoke_windows.py "dist/BDO Mode Manager/BDO Mode Manager.exe"
      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem dist/BDO-Mode-Manager-*-Setup.exe, dist/BDO-Mode-Manager-*-Setup.exe.sha256
          gh release view "$env:RELEASE_VERSION" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A release já existe; ela não será substituída automaticamente."
          }
          $assetPaths = @($assets.FullName)
          gh release create "$env:RELEASE_VERSION" @assetPaths --verify-tag --draft --title "BDO Mode Manager $env:RELEASE_VERSION" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Falha ao criar release." }
          gh release edit "$env:RELEASE_VERSION" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar release." }
